<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortinet Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="top-logo">
        <img class="top-logo-img" src="{{ url_for('static', filename='download.png') }}" alt="Fortinet Chat logo">
    </div>

    <main>
        <section id="uploadSection" class="section">
            <h2>1. Upload Your Document</h2>
            <div id="dropZone" class="drop-zone">
                <p>Drag and drop your file here, or</p>
                <form id="uploadForm">
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" name="file">
                        <label for="fileInput" id="fileLabel">Choose a file</label>
                    </div>
                    <button type="submit" id="uploadButton">Upload</button>
                </form>
            </div>
        </section>

        <section id="fileContentSection" class="section">
            <h2>2. Review Your Document</h2>
            <div id="fileContent" class="content-box"></div>
        </section>

        <section id="chatSection" class="section">
            <h2>3. Chat About Your Document</h2>
            <div id="chatHistory" class="content-box"></div>
            <form id="chatForm">
                <input type="text" id="userInput" placeholder="Type your message here...">
                <button type="submit" id="sendButton">Send</button>
            </form>
            <div style="margin-top: 10px; font-size: 0.9rem;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" id="includeFileContext" style="cursor: pointer;">
                    <span>Include file context in responses</span>
                </label>
            </div>
            <div class="chat-controls">
                <button id="exportChat">Export Chat</button>
                <button id="clearChat">Clear Chat</button>
                <button id="clearAll">Clear All Data</button>
            </div>
            <div id="spinner" class="spinner" style="display: none;"></div>
        </section>
    </main>

    <footer>
        <p>Fortinet Chat</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
